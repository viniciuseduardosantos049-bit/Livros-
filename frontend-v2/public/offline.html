<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <title>Sem conexão · Biblioteca de Leitura</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #12100e;
        color: #f2ece3;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        line-height: 1.55;
        text-align: center;
      }
      .caixa { max-width: 26rem; display: grid; gap: 1rem; justify-items: center; }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 1.6rem; margin: 0; }
      p { margin: 0; color: #a89e91; }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        background: #d99a4e;
        color: #221a0e;
        font-weight: 600;
      }
      img { width: 64px; height: 64px; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>
        O aplicativo precisa da internet para carregar esta parte pela primeira vez. Os livros que
        você já abriu continuam disponíveis offline.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
